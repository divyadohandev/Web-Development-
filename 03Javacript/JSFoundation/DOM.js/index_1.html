<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background: black; color: white;">
    <div class="parent">
         <div class="day">Monday</div>
         <div class="day">Tuesday</div>
         <div class="day">Wednesday</div>
         <div class="day">Thursday</div>
    </div>

    <script>
        const parent = document.querySelector('.parent');
        console.log(parent);
        console.log(parent.children);
        console.log(parent.children[1].innerText);

        for(let i = 0; i<parent.children.length; i++) {
            console.log(parent.children[i].innerText);
        }
        console.log(parent.firstElementChild.innerText);
        console.log(parent.lastElementChild.innerText);

        parent.children[2].style.color = 'red';

        const dayOne = document.querySelector('.day');
        console.log(dayOne);
        console.log(dayOne.parentElement);
        console.log(dayOne.nextElementSibling);

        console.log("Nodes:", parent.childNodes);
    </script>
</body>
</html>
