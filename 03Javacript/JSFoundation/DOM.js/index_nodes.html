<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodes</title>
</head>
<body style="background-color: black;">
    
</body>

<script>
    const div = document.createElement('div');
    console.log(div);
    div.className = 'main';
    div.id = Math.round(Math.random() * 1000);
    div.setAttribute('title', 'generated div');

    div.style.backgroundColor = 'red';
    div.style.color = 'white';
    // div.innerText = 'Hello World';    because of security issues, innerText is not recommended to use and it is not supported in all browsers. Instead, use textContent.
    const addText = document.createTextNode('Hello World');
    div.appendChild(addText);    // addText is a text node that is created and appended to the div element. This is a safer way to add text content to an element.

    document.body.appendChild(div);   // append the div element to the body of the document   (append means add to the end of the parent element)

</script>
</html>
